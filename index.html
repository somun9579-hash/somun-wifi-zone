<!-- Voucher -->
<section>
  <h2 class="section-title">🎟️ Voucher Login</h2>

  <div class="contact-box">

    <div style="text-align:center;">
      <p style="font-size:18px;margin-bottom:15px;">
        আপনার Voucher Code লিখুন
      </p>

      <input
        type="text"
        id="voucher"
        placeholder="Voucher Code"
        style="
          width:100%;
          padding:15px;
          border:1px solid #ddd;
          border-radius:12px;
          font-size:17px;
          margin-bottom:12px;
        "
      >

      <button
        onclick="voucherLogin()"
        class="btn"
        style="border:0;cursor:pointer;font-size:17px;"
      >
        🔐 Login
      </button>

      <p id="voucherMessage" style="margin-top:15px;"></p>
    </div>

  </div>
</section>

<script>
function voucherLogin(){

  let code = document.getElementById("voucher").value.trim();
  let message = document.getElementById("voucherMessage");

  if(code === ""){
    message.innerHTML = "⚠️ অনুগ্রহ করে Voucher Code লিখুন।";
    return;
  }

  message.innerHTML =
    "✅ Voucher Code নেওয়া হয়েছে। ইন্টারনেট চালু করতে আপনার Wi-Fi Login পেজ ব্যবহার করুন।";
}
</script>
